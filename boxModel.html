<!--
El modelo de caja se compono de 4 elementos

1. Contenido: Es la parte interna donde se muestra la informacion del elemento.

2. PAdding: Es el espacio ue existe enetre el contenido y el borde.

3. Border: Es la linea que rodea el contenido y el padding.

4. Margin: Es el espacio que separa un elento de otroe elemnto






COLAPSO DE MARGENES

* Sucede cuando hay dos elementos in-Block adyacentes
* No sucede con FlexBlox, grid y elementos que no sean BLOCK.(inline/inline-block)

Ejemplo:




-->
